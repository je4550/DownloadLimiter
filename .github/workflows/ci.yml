name: Windows build and offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check source publication
        shell: powershell
        run: ./scripts/check-publication.ps1
      - name: Build self-contained release
        shell: powershell
        run: ./build.ps1
      - name: Test accounting, shutdown and native filters
        shell: powershell
        run: ./scripts/test.ps1 -CheckAppSymbols
      - name: Check release publication
        shell: powershell
        run: ./scripts/check-publication.ps1 -ReleaseDirectory artifacts/win-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DownloadLimit-win-x64
          path: artifacts/DownloadLimit-win-x64.zip
          if-no-files-found: error
          retention-days: 14
